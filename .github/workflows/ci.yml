name: CI

on:
  push:
    branches: [main, studio]
  pull_request:
    branches: [main, studio]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ImageMagick and exiftool
        run: sudo apt-get update && sudo apt-get install -y imagemagick libimage-exiftool-perl

      - name: Build worker
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify build output
        run: |
          test -s dist/server/index.js
          ls -lh dist/server/index.js

      - name: Guard against committed build output or env files
        run: |
          if git ls-files --error-unmatch dist >/dev/null 2>&1 || git ls-files | grep -E '(^|/)\.env(\.local)?$'; then
            echo "::error::dist/ or .env files are tracked in git (see AGENTS.md)"
            exit 1
          fi

  image-metadata:
    name: Image Metadata Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl imagemagick

      - name: Check image metadata compliance
        run: npm run check:images
