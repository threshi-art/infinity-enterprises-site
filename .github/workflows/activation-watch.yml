name: SAVRONO activation watch

on:
  workflow_dispatch:
  schedule:
    # GitHub evaluates schedules only from the default branch (main), not studio.
    # This proposed weekday UTC check is not active until reviewed release governance reaches main.
    # GitHub may delay it and may disable public-repository schedules after 60 days of inactivity.
    - cron: '17 15 * * 1-5'

permissions:
  contents: read
  issues: read

concurrency:
  group: savrano-activation-watch
  cancel-in-progress: false

jobs:
  activation-watch:
    name: Read-only activation snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Test activation watch
        run: node --test test-activation-watch.js

      - name: Generate read-only queue summary
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/activation-watch.mjs
