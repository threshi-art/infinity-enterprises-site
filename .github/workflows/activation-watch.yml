name: SAVRONO activation watch

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay scheduled workflows. This is a weekday UTC check, not a real-time signal.
    - cron: '17 15 * * 1-5'

permissions:
  contents: read
  issues: read

concurrency:
  group: savrano-activation-watch
  cancel-in-progress: false

jobs:
  activation-watch:
    name: Read-only activation snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate read-only queue summary
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/activation-watch.mjs
