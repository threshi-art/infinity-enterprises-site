name: A11y gate (report-only)

on:
  push:
    branches: [main, studio]
  pull_request:
    branches: [main, studio]

permissions:
  contents: read

concurrency:
  group: a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: Accessibility and Performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run accessibility gate
        run: node tools/a11y-gate.mjs
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-reports
          path: |
            a11y-report.json
            a11y-report.md
          retention-days: 30
