<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue #47: Tech Room (Mobile)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0f13;
      color: #e8ecef;
      padding: 0;
      width: 390px;
    }
    .masthead {
      background: #0d0f13;
      border-bottom: 1px solid #7fcfe0;
      padding: 16px;
    }
    .logo {
      font-size: 14px;
      font-weight: 700;
    }
    .hero {
      padding: 32px 16px;
      text-align: center;
      border-bottom: 1px solid rgba(127, 207, 224, 0.2);
    }
    .room-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
      margin-bottom: 8px;
      font-family: 'Courier New', monospace;
    }
    .page-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .cursor-blink {
      display: inline-block;
      width: 8px;
      height: 16px;
      background: #7fcfe0;
      margin-left: 2px;
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .tagline {
      font-size: 13px;
      opacity: 0.7;
      font-family: 'Courier New', monospace;
    }
    .content {
      padding: 24px 16px;
    }
    .article-card {
      background: rgba(26, 28, 32, 0.9);
      border: 1px solid #7fcfe0;
      padding: 16px;
      margin-bottom: 16px;
    }
    .article-meta {
      font-family: 'Courier New', monospace;
      font-size: 9px;
      color: #7fcfe0;
      margin-bottom: 8px;
    }
    .article-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .article-desc {
      font-size: 12px;
      line-height: 1.5;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="masthead">
    <div class="logo">SOVRANO Infinitum</div>
  </div>
  
  <div class="hero">
    <div class="room-label">[CIRCUIT]</div>
    <h1 class="page-title">TECH<span class="cursor-blink"></span></h1>
    <p class="tagline">Cold and exact</p>
  </div>
  
  <div class="content">
    <div class="article-card">
      <div class="article-meta">[GADGETS] 2026.09.27</div>
      <div class="article-title">Placeholder Tech Headline</div>
      <div class="article-desc">
        Sample text. Hard grid, monospace, snap motion.
      </div>
    </div>
    
    <div class="article-card">
      <div class="article-meta">[AI] 2026.09.26</div>
      <div class="article-title">Another Sample Title</div>
      <div class="article-desc">
        More placeholder showing terminal aesthetic.
      </div>
    </div>
    
    <div class="article-card">
      <div class="article-meta">[SECURITY] 2026.09.25</div>
      <div class="article-title">Third Headline</div>
      <div class="article-desc">
        Additional wireframe content.
      </div>
    </div>
  </div>
</body>
</html>
